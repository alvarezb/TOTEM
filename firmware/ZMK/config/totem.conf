# ZMK handles USB vs BLE output automatically based on cable presence
CONFIG_ZMK_USB=y

# Caps Word is always included in ZMK v0.3.0 — no Kconfig needed.

# Full consumer HID (media keys, volume)
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Optional: USB serial logging for firmware development/debugging
# Uncomment these lines, plug in USB, and open a serial terminal at 115200 baud
# to see layer changes, BT events, key presses, and boot diagnostics.
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
